name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Restore
      run: dotnet restore XBVault.Desktop/XBVault.Desktop.csproj

    - name: Build
      run: dotnet build XBVault.Desktop/XBVault.Desktop.csproj -c Release --no-restore

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: XBVault-build-${{ matrix.os }}
        path: XBVault.Desktop/bin/Release/net10.0/

  test:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Test
      run: dotnet test tests/XBVault.Tests/XBVault.Tests.csproj -c Release

  build-android:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Setup JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'microsoft'
        java-version: '21'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install Android SDK components
      run: |
        sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

    - name: Clean
      run: dotnet clean XBVault.Android/XBVault.Android.csproj -r android-arm64 -c Release

    - name: Restore
      run: dotnet restore XBVault.Android/XBVault.Android.csproj -r android-arm64

    - name: Publish
      run: dotnet publish XBVault.Android/XBVault.Android.csproj -c Release -r android-arm64 --no-restore

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: XBVault-android-arm64
        path: XBVault.Android/bin/Release/net10.0-android36.0/android-arm64/publish/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, build-android]
    strategy:
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            script: powershell -File build/build-release.ps1 -Version $VERSION -Installer
          - os: windows-latest
            rid: win-arm64
            script: powershell -File build/build-release.ps1 -Version $VERSION -Arch arm64
          - os: ubuntu-latest
            rid: linux-x64
            script: bash build/build-release.sh $VERSION x64
          - os: ubuntu-latest
            rid: linux-arm64
            script: bash build/build-release.sh $VERSION arm64
          - os: macos-latest
            rid: osx-x64
            script: bash build/build-release.sh $VERSION x64
          - os: macos-latest
            rid: osx-arm64
            script: bash build/build-release.sh $VERSION arm64
          - os: windows-latest
            rid: android-arm64
            script: powershell -File build/build-release-android.ps1 -Version $VERSION
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Install Inno Setup (Windows)
      if: matrix.os == 'windows-latest'
      run: choco install innosetup --no-progress

    - name: Setup JDK (Android)
      if: matrix.rid == 'android-arm64'
      uses: actions/setup-java@v4
      with:
        distribution: 'microsoft'
        java-version: '21'

    - name: Setup Android SDK (Android)
      if: matrix.rid == 'android-arm64'
      uses: android-actions/setup-android@v3

    - name: Install Android SDK components (Android)
      if: matrix.rid == 'android-arm64'
      run: |
        sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

    - name: Build release
      shell: bash
      env:
        VERSION: ${{ github.ref_name }}
      run: ${{ matrix.script }}

    - name: Verify native executable in package
      shell: bash
      run: |
        set -euo pipefail
        shopt -s nullglob
        zips=(dist/XBVault-*.zip)
        if [ ${#zips[@]} -eq 0 ]; then
          echo "::error::No ZIP found in dist/"
          exit 1
        fi
        zip="${zips[0]}"
        echo "Verifying: $(basename "$zip")"
        case "${{ matrix.rid }}" in
          win-*)     expected="XBVault.Desktop.exe" ;;
          android-*) expected="XBVault.Android-Signed.apk" ;;
          *)         expected="XBVault.Desktop" ;;
        esac
        if unzip -Z1 "$zip" 2>/dev/null | grep -qxF "$expected"; then
          echo "✅ '$expected' present"
        elif unzip -Z1 "$zip" 2>/dev/null | grep -qi "apk\|dll\|exe"; then
          echo "✅ Package contains executables"
        else
          echo "::error::Missing '$expected' in $(basename "$zip")"
          echo "ZIP contents:"
          unzip -Z1 "$zip"
          exit 1
        fi

    - uses: actions/upload-artifact@v4
      with:
        name: release-${{ matrix.rid }}
        path: dist/XBVault-*

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - uses: actions/download-artifact@v4
      with:
        pattern: release-*
        merge-multiple: true
        path: dist

    - name: Display structure
      run: ls -lh dist/

    - name: Generate release body
      run: |
        VERSION="${{ github.ref_name }}"
        TEMPLATE="release-notes/${VERSION}.md"
        
        if [ -f "$TEMPLATE" ]; then
          echo "Using release notes template: $TEMPLATE"
          cp "$TEMPLATE" release-body.md
        else
          echo "No template found for $VERSION, using minimal body"
          echo "## What's New in ${VERSION}" > release-body.md
          echo "" >> release-body.md
          echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/$(git tag --sort=-v:refname | head -2 | tail -1)...${VERSION}" >> release-body.md
        fi
        
        # Append checksums section
        echo "" >> release-body.md
        echo "---" >> release-body.md
        echo "" >> release-body.md
        echo "## ✅ SHA256 Checksums" >> release-body.md
        echo "" >> release-body.md
        echo '```' >> release-body.md
        (cd dist && sha256sum *) >> release-body.md
        echo '```' >> release-body.md
        echo "" >> release-body.md

    - name: Update Release
      id: create_release
      uses: softprops/action-gh-release@v2
      with:
        files: dist/*
        body_path: release-body.md
        fail_on_unmatched_files: false

    - name: VirusTotal Scan
      uses: cssnr/virustotal-action@v1
      continue-on-error: true
      with:
        vt_api_key: ${{ secrets.VT_API_KEY }}
        file_globs: dist/*.zip,dist/*.apk
        sha256: true
        update_release: true
        release_id: ${{ steps.create_release.outputs.id }}
        release_heading: '### 🔬 VirusTotal'
        collapsed: true
